<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XC Pace Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XC Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app shell. Sticky header, scrolling content, fixed bottom tab bar; athlete ledger pushes over the roster; forms open as bottom sheets. */
:root{
  --bg:#EEF1EC;        /* chalk-line paper */
  --surface:#FFFFFF;
  --sunk:#E3E8E1;
  --ink:#14201A;       /* pine ink */
  --muted:#5B6B61;
  --line:#D2DAD2;
  --pine:#23583F;      /* team accent */
  --pine-soft:#DCEBE2;
  --flag:#E9B82A;      /* course-marker yellow, used sparingly */
  --flag-ink:#5A4300;
  --good:#1F7A4D; --bad:#B23B2E;
  --z-aer:#3E7C9A; --z-thr:#2F8A63; --z-vo2:#C98A12; --z-ana:#B5502F;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 24px rgba(20,32,26,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512;--surface:#18201B;--sunk:#212B25;--ink:#E6EDE8;--muted:#98A89E;--line:#2C3830;
  --pine:#6FC196;--pine-soft:#1F3328;--flag:#F0C544;--flag-ink:#F6DA86;--good:#6FCB97;--bad:#EE8577;
  --z-aer:#7DB8D6;--z-thr:#6FC196;--z-vo2:#EDB74A;--z-ana:#EB8D6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512;--surface:#18201B;--sunk:#212B25;--ink:#E6EDE8;--muted:#98A89E;--line:#2C3830;
  --pine:#6FC196;--pine-soft:#1F3328;--flag:#F0C544;--flag-ink:#F6DA86;--good:#6FCB97;--bad:#EE8577;
  --z-aer:#7DB8D6;--z-thr:#6FC196;--z-vo2:#EDB74A;--z-ana:#EB8D6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{overscroll-behavior-y:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 10px calc(16px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font:700 30px/1 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--pine);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.pscta{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.pscta .ico{width:40px;height:40px;border-radius:10px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center}
.pscta .ico svg{width:22px;height:22px}
.pscta b{font-weight:700}
.pscol{display:grid;grid-template-columns:minmax(0,1fr) 104px 40px;gap:8px;align-items:center}
.pscol select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;min-width:0;width:100%}
.iconbtn:disabled{opacity:.35;cursor:default}
.psprev{display:flex;flex-direction:column;gap:10px}
.psprev img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.btn svg{width:18px;height:18px}
.wrap{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pine)}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* multi-select chips that wrap instead of scrolling (race conditions) */
.chips.multi{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chips.multi .chip{min-height:40px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* roster */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:11px 0;flex:1;min-width:0;outline:none}
.search svg{width:18px;height:18px;color:var(--muted)}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.bib{width:44px;height:44px;border-radius:8px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;font:700 20px/1 var(--f-display);position:relative;overflow:hidden}
.bib::before,.bib::after{content:"";position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:var(--surface)}
.bib::before{left:5px}.bib::after{right:5px}
.row .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{text-align:right}
.big{font:600 17px/1.1 var(--f-num)}
.small{font-size:12px;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.pill.pr{background:var(--flag);color:#3A2B00}
.pill.basis{background:var(--pine-soft);color:var(--pine)}
.pill.sample{background:var(--flag);color:#3A2B00}
.pill.est{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.notice{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:13px;color:var(--muted)}
.notice button{margin:-8px -6px -8px auto;flex:none;border:0;background:none;color:var(--pine);font-weight:700;padding:4px 8px;min-height:40px;border-radius:10px}
/* backup status (roster) and banners (Safari tab, new version) */
.notice.bk b{color:var(--ink);font-weight:600}
.notice.bk span{flex:1;min-width:0}
.notice.bk.due{box-shadow:inset 3px 0 0 var(--flag)}
.notice.bk.warn{background:color-mix(in srgb,var(--flag) 20%,var(--surface));color:var(--flag-ink);box-shadow:inset 3px 0 0 var(--bad)}
.notice.bk.warn b{color:var(--bad)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.4}
.banner p{margin:0;flex:1 1 140px;min-width:0}
.banner>button{flex:none;border:0;background:none;font-weight:700;min-height:40px;padding:4px 8px;margin:-6px -6px -6px auto;border-radius:10px;color:inherit}
.banner.warn{background:color-mix(in srgb,var(--flag) 22%,var(--surface));color:var(--flag-ink)}
.banner.warn p{flex-basis:100%}
.banner.warn>button{margin:0 0 -8px -8px;text-decoration:underline;text-underline-offset:3px}
.banner.upd{background:var(--pine-soft);color:var(--ink)}
.banner.upd>button{background:var(--pine);color:var(--surface);padding:4px 16px;margin:-4px -4px -4px auto}
.banner .steps{flex-basis:100%;margin:4px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.banner .more{flex-basis:100%;margin-top:6px}
/* settings lists (trash, snapshots) */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .name{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.srow .why{font-size:12px;color:var(--bad);margin-top:2px}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font:700 24px/1.1 var(--f-display);text-transform:uppercase;margin:0}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}

/* athlete */
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .stat .label{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero .stat .v{font:600 22px/1.1 var(--f-num);margin-top:3px}
.hero .basis{font-size:13px;color:color-mix(in srgb,var(--bg) 75%,transparent)}
.hero .basis b{color:var(--bg)}
.hero svg.spark{width:100%;height:64px;display:block}
.hero .flagstripe{position:absolute;right:-18px;top:14px;width:90px;height:10px;background:var(--flag);transform:rotate(35deg);opacity:.9}
.zone{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:11px 14px 11px 0;border-top:1px solid var(--line)}
.zone:first-child{border-top:0}
.zone .bar{align-self:stretch;border-radius:0 4px 4px 0}
.zone .zn{font-weight:600;font-size:14px}
.zone .zd{font-size:12px;color:var(--muted)}
.zone .zt{text-align:right;font:600 14.5px/1.25 var(--f-num);white-space:nowrap}
.zone .zt small{display:block;font:500 11.5px/1.3 var(--f-num);color:var(--muted)}
.entry{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.entry:first-child{border-top:0}
.date{text-align:center;line-height:1}
.date .mo{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date .dy{font:700 24px/1 var(--f-display);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line)}
.grid2>div{background:var(--surface);padding:10px 14px}
.grid2 .d{font-size:12px;color:var(--muted);font-weight:600}
.grid2 .t{font:600 17px/1.3 var(--f-num)}
.grid2 .p{font:500 11.5px/1.3 var(--f-num);color:var(--muted)}
.grid2 .hl{background:var(--pine-soft)}

/* calculator */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.field input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;font-size:13px;white-space:nowrap;width:100%}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
table.t th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
table.t td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.t td:first-child,table.t th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-family:var(--f-body);font-weight:600;z-index:1}
table.t td .s{display:block;color:var(--muted);font-size:11.5px}
.ratingbig{font:700 56px/1 var(--f-display)}

/* workout */
.wo-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.wo-row:first-child{border-top:0}
.wo-row .t{font:600 16px/1.2 var(--f-num);text-align:right;white-space:nowrap}
.wo-row .t small{display:block;font:500 12px/1.3 var(--f-num);color:var(--muted);white-space:normal;margin:2px 0 0 auto;max-width:144px}
.woloop{display:flex;align-items:center;gap:10px}
.woloop input{flex:none;width:96px;min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:16px}
.woloop .small{flex:1;min-width:0}
.grouphead{padding:8px 14px;background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:700 26px/1.1 var(--f-display);text-transform:uppercase;margin:0 0 14px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}
.confirm{margin-top:12px;padding:12px;border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.act{display:flex;align-items:center;gap:14px;padding:4px 4px 4px 16px;width:max-content}
.toast.act.on{pointer-events:auto}
.toast button{flex:none;border:0;border-radius:9px;min-height:40px;padding:0 16px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;font-size:14px}
.toast button:focus-visible{outline-color:var(--bg)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Tinman engine (formulas match Final Surge's Tinman calculator) ============ */
const DIST = [
  {g:"Cross country",k:"4k",label:"4K",km:4},{g:"Cross country",k:"5k",label:"5K",km:5},{g:"Cross country",k:"6k",label:"6K",km:6},{g:"Cross country",k:"8k",label:"8K",km:8},
  {g:"Cross country",k:"2mi",label:"2 miles",km:3.218688},{g:"Cross country",k:"2.5mi",label:"2.5 miles",km:4.02336},{g:"Cross country",k:"3mi",label:"3 miles",km:4.828032},{g:"Cross country",k:"4mi",label:"4 miles",km:6.437376},
  {g:"Track",k:"400m",label:"400m",km:.4},{g:"Track",k:"800m",label:"800m",km:.8},{g:"Track",k:"1500m",label:"1500m",km:1.5},{g:"Track",k:"1600m",label:"1600m",km:1.6},{g:"Track",k:"1mi",label:"Mile",km:1.609344},
  {g:"Track",k:"3000m",label:"3000m",km:3},{g:"Track",k:"3200m",label:"3200m",km:3.2},
  {g:"Road",k:"10k",label:"10K",km:10},{g:"Road",k:"15k",label:"15K",km:15},{g:"Road",k:"half",label:"Half marathon",km:21.0974537664},{g:"Road",k:"marathon",label:"Marathon",km:42.1949075328},
  {g:"Other",k:"custom",label:"Custom distance",km:null}
];
const DMAP = Object.fromEntries(DIST.map(d=>[d.k,d]));
const EQUIV = [["800m",.8],["1500m",1.5],["1600m",1.6],["Mile",1.609344],["3000m",3],["3200m",3.2],["2 miles",3.218688],["4K",4],["2.5 miles",4.02336],["3 miles",4.828032],["5K",5],["6K",6],["4 miles",6.437376],["8K",8],["10K",10]];
const ZONES = [
  {n:"Recovery",lo:.499999999999999,hi:.549999999999999,miss:0,c:"--z-aer",d:"Shakeouts, cooldowns"},
  {n:"Easy",lo:.574999999999999,hi:.624999999999999,miss:0,c:"--z-aer",d:"Daily aerobic miles"},
  {n:"Moderate",lo:.649999999999999,hi:.699999999999999,miss:0,c:"--z-aer",d:"Steady runs, long runs"},
  {n:"Tempo",lo:.749999999999999,hi:.799999999999999,miss:0,c:"--z-thr",d:"Continuous tempo runs"},
  {n:"Threshold",lo:.824999999999999,hi:.854999999999999,miss:0,c:"--z-thr",d:"MLSS · cruise intervals"},
  {n:"CV",lo:.874999999999999,hi:.899999999999999,miss:0,c:"--z-thr",d:"Critical velocity reps"},
  {n:"Aerobic Power",lo:.92499999999999,hi:.95499999999999,miss:0,c:"--z-vo2",d:"Long VO2 reps"},
  {n:"VO2 max",lo:.97499999999999,hi:1,miss:0,c:"--z-vo2",d:"Hard intervals"},
  {n:"Mixed Zone",lo:1.05,hi:1.1,miss:0,c:"--z-vo2",d:"Mile-type reps"},
  {n:"Anaerobic Capacity",lo:1.15,hi:1.2,maxM:800,c:"--z-ana",d:"Reps of 800m or less"},
  {n:"Anaerobic Power",lo:1.25,hi:1.3,maxM:500,c:"--z-ana",d:"Reps of 500m or less"},

// Whole calendar days since a timestamp (0 = today)
function daysSince(ts){const a=new Date(ts),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.round((b-a)/864e5))}
const backupAgo = ()=>{if(!SET.lastBackup) return "";const d=daysSince(SET.lastBackup);return d===0?"today":d===1?"yesterday":`${d} days ago`};
function backupLine(){
  if(!Object.values(S.athletes).some(a=>!a.sample)) return "";
  const n=Object.values(S.results).filter(r=>!r.sample).length, d=SET.lastBackup?daysSince(SET.lastBackup):null;
  const lvl = d==null ? (n>=5?"warn":"") : d>14 ? "warn" : d>7 ? "due" : "";
  const msg = d==null ? `<b>Never backed up.</b>${n>=5?" Your roster is only on this phone.":""}` : `<b>Last backup: ${backupAgo()}</b>`;
  return `<div class="notice bk ${lvl}"><span>${msg}</span><button data-act="exportData">Back up now</button></div>`;
}
// iPhone/iPad browser tab instead of the Home Screen app: the browser keeps its own separate copy of the data.
function browserTab(){
  try{
    const ua=navigator.userAgent||"", ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1); // iPads report a Mac user agent
    if(!ios||navigator.standalone===true||matchMedia("(display-mode: standalone)").matches) return "";
    return /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)?"other":"safari";
  }catch{return ""}
}

function sparkSVG(a){
  const rs=resultsFor(a.id).filter(r=>r.kind!=="workout"&&!isEst(r)).slice().reverse();
  const pts=rs.map(r=>{const c=resultCalc(r,a.gender);return c?{d:r.date,v:Tin.equiv(5,c.t3k)}:null}).filter(Boolean);
  if(pts.length<2) return `<div class="small" style="color:color-mix(in srgb,var(--bg) 65%,transparent)">Log two or more races to see the season trend.</div>`;
  const W=320,H=64,P=6, vs=pts.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), span=Math.max(hi-lo,5);
  const x=i=>P+i*(W-2*P-44)/(pts.length-1), y=v=>P+(v-lo)/span*(H-2*P); // faster = higher on the chart
  const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const last=pts[pts.length-1], li=pts.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="5K-equivalent trend, latest ${fmtEq(last.v)}">
    <path d="${d} L${x(li)} ${H} L${x(0)} ${H} Z" fill="var(--pine)" opacity=".25"/>
    <path d="${d}" fill="none" stroke="var(--flag)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===li?4:2.2}" fill="${i===li?"var(--flag)":"var(--bg)"}"/>`).join("")}
    <text x="${x(li)+8}" y="${Math.min(Math.max(y(last.v)+4,12),H-4)}" fill="var(--bg)" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">${fmtEq(last.v)}</text></svg>`;
}

// Workout runners, fastest first
function woRows(){const w=U.wo;
  return Object.values(S.athletes).filter(a=>(w.grp==="All"||a.group===w.grp)&&(w.gender==="all"||a.gender===w.gender))
    .map(a=>({a,c:athleteCalc(a)})).sort((x,y)=>(y.c?.rating||0)-(x.c?.rating||0)||x.a.name.localeCompare(y.a.name));}
const woLoop = ()=>+U.wo.loop>=100?+U.wo.loop:0; // shorter "loops" are ignored (also while typing 400)
// Timed rep: [slow, fast] whole meters covered in `sec` at zone z, or null if the fast end is past the zone's longest rep.
function woDist(c,z,sec){const d=[z.lo,z.hi].map(f=>Math.round(sec*1000*Math.pow(f,.7931)/c.v)); return z.maxM&&d[1]>z.maxM+.5?null:d}
function lapsText(dS,dF,L){ // "2 laps + 12–46 m"; across a lap line: "1 lap + 390 m – 2 laps + 30 m"
  const nS=Math.floor(dS/L), nF=Math.floor(dF/L), rS=dS-nS*L, rF=dF-nF*L, lp=n=>`${n} lap${n===1?"":"s"}`;
  const one=(n,r)=>n?`${lp(n)}${r?` + ${r} m`:""}`:`${r} m`;
  if(!nF) return "";
  if(nS===nF) return rS===rF ? one(nS,rS) : `${lp(nS)} + ${rS}–${rF} m`;
  return `${one(nS,rS)} – ${one(nF,rF)}`;
}
// One runner's target for the current workout: [main, laps line]
function woCell(c){
  const w=U.wo, z=ZONES[w.zone]; if(!c) return null;
  if(w.mode==="time"){const d=woDist(c,z,w.sec), L=woLoop(); return d?[`${d[0]}–${d[1]} m`,L?lapsText(d[0],d[1],L):""]:["–",""]}
  const p=Tin.zone(c.v,z,w.rep); return [p?fmtRange(p):"–",""];
}
// Everything below the workout controls (redrawn alone while the loop length is typed). A laps line breaks only after its dash.
function woOut(){
  const w=U.wo, z=ZONES[w.zone], tm=w.mode==="time", L=woLoop(), rows=woRows();

      return `<div class="wo-row"><div style="min-width:0"><div class="name" style="font-weight:600">${esc(a.name)}</div><div class="small">${c?[`${(c.rating*100).toFixed(1)}%`,estPace(c)?"Estimated":"",esc(a.group||"")].filter(Boolean).join(" · "):"No results yet"}</div></div>

function renderCalcOut(){

  if(!km||!isFinite(sec)||sec<=0){out.innerHTML=`<div class="card empty"><p>Type a race time like <span class="num">1745</span> for <span class="num">17:45</span> to see the rating, training paces and equivalent times.</p></div>`;return}
  const c=Tin.base(km,sec,k.gender), per=sec/km;
  const cols=[["Mile",1609.344],["1600",1600],["1000",1000],["800",800],["600",600],["500",500],["400",400],["300",300],["200",200],["100",100]];
  out.innerHTML=`
    <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">

    <div class="list scrollx"><table class="t"><tr>${[["Mile",1.609344],["1600",1.6],["1K",1],["800",.8],["400",.4],["200",.2]].map(([l])=>`<th>${l}</th>`).join("")}</tr>
      <tr>${[1.609344,1.6,1,.8,.4,.2].map(x=>`<td style="text-align:right">${fmtT(per*x)}</td>`).join("")}</tr></table></div>
    <div class="label">Training paces · flat ground</div>
    <div class="list scrollx"><table class="t"><tr><th>Intensity</th>${cols.map(([l])=>`<th>${l}</th>`).join("")}</tr>
      ${ZONES.map(z=>`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${z.c});margin-right:6px"></span>${z.n}</td>${cols.map(([,m])=>{const p=Tin.zone(c.v,z,m);return `<td>${p?`${fmtT(p[0])}<span class="s">${fmtT(p[1])}</span>`:"–"}</td>`}).join("")}</tr>`).join("")}
    </table></div>

    <div class="list"><div class="grid2">${EQUIV.map(([l,kk])=>{const t=Tin.equiv(kk,c.t3k);return `<div><div class="d">${l}</div><div class="t">${fmtT(t)}</div><div class="p">${fmtT(t/kk*1.609344)} /mi</div></div>`}).join("")}</div></div>`;
}

/* ============ settings: backup status, trash, snapshots ============ */
const nRunners = n=>`${n} runner${n===1?"":"s"}`, nResults = n=>`${n} result${n===1?"":"s"}`;
function setCountText(){const ago=backupAgo();
  return `Everything is stored on this phone: ${nRunners(Object.keys(S.athletes).length)}, ${nResults(Object.keys(S.results).length)}. A backup file can be saved to Files, AirDropped or emailed, and restored on any phone. ${ago?`Last backup: ${ago}.`:"Never backed up."}`}
const dayStamp = at=>new Date(at).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const snapWhen = at=>new Date(at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function trashTitle(x){
  if(x.type==="athlete") return x.data.name||"Runner";
  const r=x.data;
  return `${trashRunner(r.athleteId)?.name||"Deleted runner"} — ${r.meet||(r.kind==="tt"?"Time trial":r.kind==="est"?"Estimate":"Race")}, ${distLabel(r)}, ${fmtRace(+r.seconds)}`;
}
function trashHTML(){
  const t=S.trash;
  if(!t.length) return `<p class="small" style="margin:0">Trash is empty. Deleted runners and entries stay here for ${TRASH_DAYS} days, so you can bring them back.</p>`;
  return `<p class="small" style="margin:0">Deleted runners and entries stay here for ${TRASH_DAYS} days.</p>
    <div class="list">${t.map(x=>{const n=(x.results||[]).length;
      return `<div class="srow"><div style="min-width:0"><div class="name">${esc(trashTitle(x))}</div>
        <div class="small">${x.type==="athlete"?(n?`Runner and ${n} entr${n===1?"y":"ies"}`:"Runner"):"Entry"} · Deleted ${dayStamp(x.at)}</div>
        ${SH?.trashWhy?.tid===x.tid?`<div class="why">${esc(SH.trashWhy.msg)}</div>`:""}</div>
        <button type="button" class="btn ghost sm" data-act="trashRestore" data-v="${esc(x.tid)}">Restore</button></div>`}).join("")}</div>
    ${SH?.trashAsk?`<div class="confirm" style="margin:0">Permanently delete ${t.length===1?"this item":`these ${t.length} items`}? A snapshot is saved first, so you can still get ${t.length===1?"it":"them"} back from Snapshots.
      <div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="trashKeep">Keep</button><button type="button" class="btn" style="background:var(--bad)" data-act="trashEmpty">Empty trash</button></div></div>`
    :`<button type="button" class="btn danger block" data-act="trashAsk">Empty trash</button>`}`;
}
function snapsHTML(){
  const L=snapList(), ask=L.find(x=>x.at===SH?.snapAsk), size=x=>`${nRunners(Object.keys(x.athletes).length)}, ${nResults(Object.keys(x.results).length)}`;
  if(!L.length) return `<p class="small" style="margin:0">None yet. Before big changes, like restoring a backup or emptying the trash, the app saves a copy of your data here. The last 3 are kept.</p>`;
  return `<p class="small" style="margin:0">Copies of your data saved automatically before big changes. The last 3 are kept on this phone.</p>
    <div class="list">${L.map(x=>`<div class="srow"><div style="min-width:0"><div class="name">${esc(x.label||"Snapshot")}</div><div class="small">${snapWhen(x.at)} · ${size(x)}</div></div>
      <button type="button" class="btn ghost sm" data-act="snapAsk" data-v="${+x.at}">Restore</button></div>`).join("")}</div>
    ${ask?`<div class="confirm" style="margin:0">Replace everything on this phone with the snapshot from ${snapWhen(ask.at)} (${size(ask)})? Your current data is saved as a snapshot first.
      <div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="snapKeep">Cancel</button><button type="button" class="btn" data-act="snapRestore" data-v="${+ask.at}">Restore</button></div></div>`:""}`;
}
// Redraw the Settings sections in place (keeps a typed team name and a pending restore), then move focus to `focus`.
function setRefresh(focus){[["#setCount",setCountText],["#trashBox",trashHTML],["#snapBox",snapsHTML]].forEach(([id,f])=>{const el=$(id);if(el)el.innerHTML=f()});
  if(focus) document.querySelector("#sheetRoot "+focus)?.focus()}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, v=t.dataset.v;
  switch(act){
    case "tab": U.view=v; U.athlete=null; render(); scrollTo(0,0); break;
    case "open": U.athlete=t.dataset.id; U.atab="paces"; render(); scrollTo(0,0); break;
    case "back": U.athlete=null; render(); break;
    case "grp": U.grp=v; render(); break;
    case "gender": U.gender=v; render(); break;
    case "sort": U.sort=v; saveUI(); render(); break;
    case "atab": U.atab=v; render(); break;
    case "rep": U.rep=+v; saveUI(); render(); break;
    case "wzone": U.wo.zone=+v; if(ZONES[+v].maxM&&U.wo.rep>ZONES[+v].maxM) U.wo.rep=ZONES[+v].maxM>=400?400:ZONES[+v].maxM; saveUI(); render(); break;
    case "wrep": U.wo.rep=+v; saveUI(); render(); break;
    case "wmode": U.wo.mode=v==="time"?"time":"dist"; saveUI(); render(); break;
    case "wsec": U.wo.sec=+v; saveUI(); render(); break;
    case "wgrp": U.wo.grp=v; saveUI(); render(); break;
    case "wgender": U.wo.gender=v; saveUI(); render(); break;
    case "cgender": U.calc.gender=v; render(); break;
    case "addAthlete": openSheet({type:"athlete"}); break;
    case "editAthlete": openSheet({type:"athlete",a:S.athletes[t.dataset.id]}); break;
    case "addResult": openSheet({type:"result",aid:U.athlete}); break;
    case "editResult": {const r=S.results[t.dataset.id]; const a=S.athletes[r.athleteId]; openSheet({type:"result",r,aid:r.athleteId,isBasis:basisOf(a)?.id===r.id}); break;}
    case "saveCalc": {const k=U.calc; if(!Object.keys(S.athletes).length){toast("Add a runner on the Roster tab first");break}
      openSheet({type:"result",pickAthlete:true,dist:k.dist,meters:k.meters,time:k.time}); break;}
    case "closeSheet": closeSheet(); break;
    case "agender": $("#aGender").value=v; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); break;
    case "rkind": $("#rKind").value=v; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); $("#rEstHint").hidden=v!=="est"; break;
    case "rcond": t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!=="true"); break;
    case "askDelAthlete": $("#delBox").innerHTML=`<div class="confirm">Delete ${esc(SH.a.name)} and all ${resultsFor(SH.a.id).length} ledger entries? You can restore them from Trash in Team & backup for ${TRASH_DAYS} days.<div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="closeSheet">Keep</button><button type="button" class="btn" style="background:var(--bad)" data-act="delAthlete">Delete</button></div></div>`; break;
    case "delAthlete": {const id=SH.a.id, tid=trashAthlete(id); U.athlete=null; closeSheet(); render();
      toastAction("Runner deleted","Undo",()=>{const why=restoreTrash(tid); if(why) return toast(why); U.athlete=id; render(); scrollTo(0,0); toast("Runner restored")},e.detail===0); break;}

/* ============ team pace sheet (image export) ============ */
const expDist = m => Math.abs(m-1609.344)<.5 ? "Mile" : `${m}m`;
const expZone = z => z.n.replace(/\b\w/g,c=>c.toUpperCase());
// Column header as [distance, what]; one line when it fits ("Mile Threshold", "5K Finish", "5K Pace /mi", "5K Mile Splits", "3 Mile Splits")
const colLines = c => c.k==="race"
  ? [PS_RACE[c.dk], c.show==="pace"?"Pace /mi":c.show==="splits"?(/Mile$/.test(PS_RACE[c.dk])?"Splits":"Mile Splits"):"Finish"]
  : [expDist(c.m), expZone(ZONES[c.z])];
const colHead = c => colLines(c).join(" ");
const psAutoTitle = cfg => cfg.cols.map(c=>colHead(c)+(c.k==="race"?"":" Pace")).join(" / ");
const PS_EST_NOTE = "* Estimated pace — no race yet", PS_FOOT_H = 40; // footnote under the table, only when a row is estimated
const psName = r => r.a.name+(estPace(r.c)?" *":"");
// Hundredths cut off like Final Surge, always two decimals like the coach's sheet ("5:50.00")
function fmt2(s){
  if(!isFinite(s)) return "–";
  const cs=Math.floor(s*100), h=Math.floor(cs/360000), m=Math.floor(cs%360000/6000), sec=Math.floor(cs%6000/100), f=String(cs%100).padStart(2,"0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}.${f}` : m ? `${m}:${String(sec).padStart(2,"0")}.${f}` : `${sec}.${f}`;
}
function psCell(c,col,end){
  if(col.k==="race") return raceCell(c,col); // "Time shown" only applies to training zones
  const p=Tin.zone(c.v,ZONES[col.z],col.m); if(!p) return "–";
  return end==="slow"?fmt2(p[0]) : end==="mid"?fmt2((p[0]+p[1])/2) : end==="range"?`${fmt2(p[0])}–${fmt2(p[1])}` : fmt2(p[1]);
}
// Race plan from the runner's Tinman equivalent time: finish, per-mile pace, or even-pace mile marks in whole seconds ("5:43 · 11:26 · 17:09")
function raceCell(c,col){
  const km=DMAP[col.dk].km, t=Tin.equiv(km,c.t3k), mi=km/1.609344;
  if(col.show==="pace") return fmt2(t/mi);
  if(col.show==="splits") return Array.from({length:Math.floor(mi+1e-9)},(_,i)=>fmt(t/mi*(i+1))).join(" · ");
  return fmt2(t);
}
function psRows(cfg){
  const pool=Object.values(S.athletes).filter(a=>(cfg.grp==="All"||a.group===cfg.grp)&&(cfg.gender==="all"||a.gender===cfg.gender));
  const rows=pool.map(a=>({a,c:athleteCalc(a)})).filter(r=>r.c&&isFinite(r.c.v));
  rows.sort((x,y)=>cfg.sort==="name" ? x.a.name.localeCompare(y.a.name) : (x.c.v-y.c.v)||x.a.name.localeCompare(y.a.name));
  return {rows, missing:pool.length-rows.length};
}
function psSubtitle(cfg,page,pages){
  const team=(typeof SET!=="undefined"&&SET.team)||"";
  const d=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const note=cfg.cols.some(c=>c.k!=="race")&&{mid:"Middle of Tinman range",slow:"Slow end of Tinman range",range:"Tinman range, slow–fast"}[cfg.end]||"";
  return [team, cfg.grp!=="All"?cfg.grp:"", {f:"Girls",m:"Boys"}[cfg.gender]||"", note, d, pages>1?`Page ${page+1} of ${pages}`:""].filter(Boolean).join("  ·  ");
}
const PS_FONT='"Helvetica Neue",Helvetica,Arial,sans-serif';
function psLayout(cfg,rows){
  const ctx=document.createElement("canvas").getContext("2d"), PAD=48, MINW=1300;
  const heads=cfg.cols.map(colHead);
  ctx.font=`400 28px ${PS_FONT}`;
  const colW=cfg.cols.map(col=>Math.max(220,...rows.map(r=>ctx.measureText(psCell(r.c,col,cfg.end)).width+56)));
  ctx.font=`700 26px ${PS_FONT}`;
  const headLines=heads.map((h,i)=>{
    const hw=Math.ceil(ctx.measureText(h).width+36);
    if(hw<=Math.max(colW[i],284)){ colW[i]=Math.max(colW[i],hw); return [h]; }
    const lines=colLines(cfg.cols[i]);
    colW[i]=Math.max(colW[i],...lines.map(l=>ctx.measureText(l).width+36)); return lines;
  });
  ctx.font=`700 28px ${PS_FONT}`;
  let nameW=Math.min(560,Math.max(320,...rows.map(r=>ctx.measureText(psName(r)).width+48)));
  let extra=MINW-PAD*2-nameW-colW.reduce((x,y)=>x+y,0);
  for(let i=0;i<colW.length&&extra>0;i++){const add=Math.min(extra,Math.max(0,284-colW[i]));colW[i]+=add;extra-=add}
  if(extra>0) nameW+=extra;
  const W=PAD*2+nameW+colW.reduce((x,y)=>x+y,0);
  return {PAD,W,nameW,colW,heads,headLines,headH:headLines.some(l=>l.length>1)?96:64,ROW:62};
}
function psFit(ctx,text,max){
  if(ctx.measureText(text).width<=max) return text;
  let t=text; while(t.length>1&&ctx.measureText(t+"…").width>max) t=t.slice(0,-1);
  return t.trimEnd()+"…";
}
function psDrawPage(L,cfg,rows,page,pages){
  const {PAD,W,nameW,colW,headLines,headH,ROW}=L;
  const title=(cfg.title||"").trim()||psAutoTitle(cfg), sub=psSubtitle(cfg,page,pages);
  const top=36, titleH=44, subH=sub?34:0, gap=24, tableY=top+titleH+subH+gap;
  const foot=rows.some(r=>estPace(r.c)), H=tableY+headH+rows.length*ROW+48+(foot?PS_FOOT_H:0);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d"); ctx.textBaseline="middle";
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,W,H);
  // title + subtitle
  let ts=34; ctx.font=`400 ${ts}px ${PS_FONT}`;
  while(ts>20&&ctx.measureText(title).width>W-PAD*2){ts-=2;ctx.font=`400 ${ts}px ${PS_FONT}`}
  ctx.fillStyle="#111111"; ctx.textAlign="center"; ctx.fillText(psFit(ctx,title,W-PAD*2),W/2,top+titleH/2);
  if(sub){ctx.font=`400 21px ${PS_FONT}`;ctx.fillStyle="#666666";ctx.fillText(psFit(ctx,sub,W-PAD*2),W/2,top+titleH+subH/2)}
  const xs=[PAD,PAD+nameW]; colW.forEach(w=>xs.push(xs[xs.length-1]+w));
  const right=xs[xs.length-1];
  // header row
  ctx.fillStyle="#222222"; ctx.fillRect(PAD,tableY,right-PAD,headH);
  ctx.fillStyle="#FFFFFF"; ctx.font=`700 26px ${PS_FONT}`;
  ctx.textAlign="left"; ctx.fillText("Athlete",PAD+20,tableY+headH/2);
  ctx.textAlign="center";
  headLines.forEach((lines,i)=>{const cx=(xs[i+1]+xs[i+2])/2;
    if(lines.length===1) ctx.fillText(psFit(ctx,lines[0],colW[i]-24),cx,tableY+headH/2);
    else lines.forEach((l,k)=>ctx.fillText(psFit(ctx,l,colW[i]-24),cx,tableY+headH/2+(k?16:-16)));
  });
  // body rows
  rows.forEach((r,i)=>{
    const y=tableY+headH+i*ROW;
    ctx.fillStyle=i%2?"#F4F4F4":"#FFFFFF"; ctx.fillRect(PAD,y,right-PAD,ROW);
    ctx.fillStyle="#111111"; ctx.textAlign="left"; ctx.font=`700 28px ${PS_FONT}`;
    ctx.fillText(psFit(ctx,psName(r),nameW-40),PAD+20,y+ROW/2+1);
    ctx.textAlign="center"; ctx.font=`400 28px ${PS_FONT}`;
    cfg.cols.forEach((col,k)=>ctx.fillText(psFit(ctx,psCell(r.c,col,cfg.end),colW[k]-16),(xs[k+1]+xs[k+2])/2,y+ROW/2+1));
  });
  // grid lines
  const bottom=tableY+headH+rows.length*ROW;
  ctx.strokeStyle="#D0D0D0"; ctx.lineWidth=1.5;
  for(let i=0;i<=rows.length;i++){const y=Math.round(tableY+headH+i*ROW)+.5;ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(right,y);ctx.stroke()}
  xs.forEach((x,i)=>{ctx.strokeStyle=i===0||i===xs.length-1?"#D0D0D0":"#C8C8C8";ctx.beginPath();ctx.moveTo(Math.round(x)+.5,tableY+headH);ctx.lineTo(Math.round(x)+.5,bottom);ctx.stroke()});
  ctx.strokeStyle="#555555"; xs.slice(1,-1).forEach(x=>{ctx.beginPath();ctx.moveTo(Math.round(x)+.5,tableY);ctx.lineTo(Math.round(x)+.5,tableY+headH);ctx.stroke()});
  // footnote for runners whose paces come from a coach estimate
  if(foot){ctx.fillStyle="#555555";ctx.textAlign="left";ctx.font=`400 22px ${PS_FONT}`;ctx.fillText(psFit(ctx,PS_EST_NOTE,right-PAD),PAD,bottom+34)}
  return cv;
}
function psClear(){ if(SH?.imgs){ SH.imgs.forEach(x=>{try{URL.revokeObjectURL(x.url)}catch{}}); SH.imgs=null; } }
let psGen=0; // bumped whenever images being created would no longer match the builder
function psChanged(){ psGen++; saveUI(); psClear(); rerenderSheet(); }
function psPreviewHTML(imgs){
  return `<div class="psprev">${imgs.map((x,i)=>`<img src="${x.url}" alt="Pace sheet${imgs.length>1?`, page ${i+1}`:""}">`).join("")}</div>
    <div class="actions" style="margin-top:0"><button type="button" class="btn" data-act="psShare">${I.share}Share ${imgs.length>1?imgs.length+" images":"image"}</button><button type="button" class="btn ghost" data-act="psCopy">${I.copy}Copy as text</button></div>
    <p class="hint" style="margin:0">Share opens your phone's share menu: Messages, AirDrop or Save Image. You can also press and hold an image to save it.</p>`;
}
async function psMake(){
  if(!SH||SH.type!=="pacesheet") return;
  const sh=SH, gen=++psGen, cfg=JSON.parse(JSON.stringify(U.ps)), {rows}=psRows(cfg);
  if(!rows.length){toast("No runners with results to put on the sheet.");return}
  const stale=()=>SH!==sh||gen!==psGen;
  const btn=document.querySelector('[data-act="psMake"]'); if(btn){btn.disabled=true;btn.lastChild.textContent="Creating…"}
  const L=psLayout(cfg,rows);
  // iPhones on iOS 17 can't make a canvas over 4096×4096 pixels in area, so very long sheets split into pages
  const cap=Math.max(1,Math.floor((Math.min(16777216/L.W,32767)-(138+L.headH+48+(rows.some(r=>estPace(r.c))?PS_FOOT_H:0)))/L.ROW));
  const want=cfg.per>0?cfg.per:rows.length, per=Math.min(want,cap), pages=Math.ceil(rows.length/per), size=Math.ceil(rows.length/pages);
  const slug=((cfg.title||"").trim()||psAutoTitle(cfg)).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"pace-sheet";
  const imgs=[];
  try{
    for(let p=0;p<pages;p++){
      const cv=psDrawPage(L,cfg,rows.slice(p*size,(p+1)*size),p,pages);
      const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
      if(!blob) throw new Error("toBlob");
      const file=new File([blob],`${slug}${pages>1?`-${p+1}`:""}.png`,{type:"image/png"});
      imgs.push({file,url:URL.createObjectURL(file)});
    }
  }catch{ imgs.forEach(x=>URL.revokeObjectURL(x.url)); if(!stale()){ psResetMakeBtn(); toast(pages>1?"Couldn't create the images. Try Pages of 30 with fewer runners.":"Couldn't create the image. Try Pages of 30."); } return }
  if(stale()){ imgs.forEach(x=>URL.revokeObjectURL(x.url)); return }
  psClear(); SH.imgs=imgs; psResetMakeBtn();
  const out=$("#psOut"); if(out){ out.innerHTML=psPreviewHTML(imgs); out.scrollIntoView({block:"start",behavior:"smooth"}); }
  if(want>cap) toast(`Too many runners for one image, so it was split into ${pages} pages.`);
}
function psResetMakeBtn(){const b=document.querySelector('[data-act="psMake"]');if(b){b.disabled=false;b.lastChild.textContent="Create image"}}
async function psShare(){
  const imgs=SH?.imgs; if(!imgs?.length) return;
  const files=imgs.map(x=>x.file);
  try{
    if(navigator.canShare&&navigator.canShare({files})){ await navigator.share({files}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const urls=imgs.map(x=>({url:x.url,name:x.file.name}));

  toast(urls.length>1?"Saving images. If nothing downloads, press and hold each image.":"Saving image. If nothing downloads, press and hold the image.");
}
function psText(cfg){
  const {rows}=psRows(cfg), heads=cfg.cols.map(colHead);
  return [(cfg.title||"").trim()||psAutoTitle(cfg), psSubtitle(cfg,0,1), ""].concat(rows.map(r=>`${psName(r)}: `+cfg.cols.map((col,i)=>`${heads[i]} ${psCell(r.c,col,cfg.end)}`).join(" · ")))
    .concat(rows.some(r=>estPace(r.c))?["",PS_EST_NOTE]:[]).join("\n");

/* ============ text exports ============ */
function pacesText(a){

function workoutText(){

/* ============ backup ============ */
async function exportData(){
  const stamp=today(), name=`xc-ledger-backup-${stamp}.json`;
  // Must run straight from the tap (no await before share), or iPhone blocks the share sheet.
  const json=JSON.stringify({app:"xc-ledger",version:2,appVersion:APP_VERSION,exported:new Date().toISOString(),team:SET.team,athletes:S.athletes,results:S.results,trash:S.trash,aliases:S.aliases},null,1);
  const file=new File([json],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"XC Ledger backup"}); }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }
    SET.lastBackup=Date.now(); saveSet(); toast("Backup ready"); render(); setRefresh();
  }catch(err){ if(err&&err.name!=="AbortError") toast("Couldn't create the backup file."); }
}
// Reads backups from version 1 (athletes, results) and version 2 (adds trash, aliases).
function readImport(f){
  const box=$("#importBox"); const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch{d=null}
    const fail=m=>{box.innerHTML=`<div class="confirm" style="color:var(--bad)">${m}</div>`};
    if(!isObj(d)||d.app!=="xc-ledger"||!isObj(d.athletes)||!isObj(d.results)) return fail("That file isn't an XC Ledger backup. Choose a file named like xc-ledger-backup-2026-10-12.json.");
    const ver=d.version==null?1:+d.version;
    if(ver>2) return fail("This backup was made by a newer version of XC Ledger. Close and reopen the app to update it, then try again.");
    if(ver!==1&&ver!==2) return fail("That file isn't an XC Ledger backup. Choose a file named like xc-ledger-backup-2026-10-12.json.");
    SH.pending=d; const na=Object.keys(d.athletes).length, nr=Object.keys(d.results).length;
    box.innerHTML=`<div class="confirm">Replace everything on this phone with the backup from ${esc(new Date(d.exported).toLocaleDateString())} (${nRunners(na)}, ${nResults(nr)})? Your current data is saved as a snapshot first.<div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="closeSheet">Cancel</button><button type="button" class="btn" data-act="doImport">Restore</button></div></div>`;
    if(d.team&&!SET.team){SET.team=d.team;saveSet()}
  };
  r.readAsText(f);
}

/* ============ sample runners (clearly marked, removable) ============ */
async function seed(){
  const d=(n)=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
  const people=[
    ["Sample · Maya Ortiz","f","11","Varsity",[[42,"tt","Summer time trial","2mi",12*60+58],[24,"race","Season opener","5k",20*60+41],[10,"race","Invitational","5k",20*60+5]]],
    ["Sample · Jordan Lee","m","12","Varsity",[[38,"tt","Summer time trial","3200m",10*60+42],[24,"race","Season opener","5k",17*60+22],[10,"race","Invitational","5k",16*60+58]]],
    ["Sample · Priya Shah","f","9","JV",[[24,"race","Season opener","5k",23*60+50],[10,"race","Invitational","5k",23*60+12]]],
    ["Sample · Eli Brooks","m","10","JV",[[30,"tt","Mile time trial","1mi",5*60+21],[17,"race","Dual meet","3mi",17*60+55]]]
  ];
  for(const [name,g,grade,group,rs] of people){
    const aid=uid(); let last=null;
    await put("athletes",aid,{name,gender:g,grade,group,notes:"",sample:true,created:Date.now()});
    for(const [ago,kind,meet,dk,sec] of rs){const rid=uid();last=rid;await put("results",rid,{athleteId:aid,kind,meet,date:d(ago),distKey:dk,meters:null,seconds:sec,adj:0,notes:"",sample:true,created:Date.now()})}
  }
  toast("Added 4 sample runners");
}

render();
initStore();
// Updates: a new service worker taking over an already-running app shows a banner; the coach decides when to reload.
let swReg=null;
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let swHad=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(swHad&&!U.swNew){U.swNew=true;render()} swHad=true});
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r}).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&swReg){try{swReg.update().catch(()=>{})}catch{}}});
}
