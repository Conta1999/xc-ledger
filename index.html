/* ============ meet recap (image export in the pace sheet's style, and text) ============ */
const rcNote = x => x.b==="PR"?`PR −${gapTxt(x.by)}`:x.b==="SB"&&x.by?`SB −${gapTxt(x.by)}`:x.b; // image Note column
const rcCells = (x,s,place) => [String(x.tp), x.a.name, fmtRace(x.sec), rcPace(x,s), ...(place?[x.place?String(x.place):""]:[]), rcNote(x)];
// Columns #, Athlete, Time, Pace /mi, (Place, when places were entered), Note; one width for every section so the tables line up
function rcLayout(R){
  const ctx=document.createElement("canvas").getContext("2d"), PAD=48, MINW=1080, place=R.place;
  const heads=["#","Athlete","Time","Pace /mi",...(place?["Place"]:[]),"Note"], cells=R.secs.flatMap(s=>s.rows.map(x=>rcCells(x,s,place)));
  ctx.font=`400 28px ${PS_FONT}`;
  const w=heads.map((h,i)=>Math.max(i?150:90,...cells.map(c=>ctx.measureText(c[i]).width+56)));
  ctx.font=`700 26px ${PS_FONT}`; heads.forEach((h,i)=>{w[i]=Math.max(w[i],Math.ceil(ctx.measureText(h).width+36))});
  ctx.font=`700 28px ${PS_FONT}`; w[1]=Math.min(560,Math.max(320,...cells.map(c=>ctx.measureText(c[1]).width+48)));
  let extra=MINW-PAD*2-w.reduce((a,b)=>a+b,0);
  for(let i=2;i<w.length&&extra>0;i++){const add=Math.min(extra,Math.max(0,200-w[i]));w[i]+=add;extra-=add}
  if(extra>0) w[1]+=extra;
  return {PAD, W:PAD*2+w.reduce((a,b)=>a+b,0), place, cols:heads.map((h,i)=>({w:w[i],lines:[h],left:i===1})),
    headH:64, ROW:62, secH:64, sumH:56, gapS:28, head:138, foot:40};
}
// Sections onto pages: everything on one image unless `split` (each section starts a new image) or it's taller than an iPhone canvas allows.
// A page is a list of {s: section, from, to: its rows, cont: continues from the page before, sum: its stats line goes under}.
function rcPages(L,R,split){
  const maxH=psMaxH(L.W), pages=[]; let pg=null, h=0;
  R.secs.forEach(s=>{
    const sumH=rcSum(s).length?L.sumH:0;
    if(split&&pg){pages.push(pg);pg=null}
    for(let i=0;i<s.rows.length;){
      if(!pg){pg=[];h=L.head+L.foot}
      const room=maxH-h-(pg.length?L.gapS:0)-L.secH-L.headH, left=s.rows.length-i;
      let n=left*L.ROW+sumH<=room?left:Math.min(left-1,Math.floor(room/L.ROW)); // the rest with its stats line, or as many rows as fit
      if(n<1&&pg.length){pages.push(pg);pg=null;continue}
      n=Math.max(1,n);
      const last=i+n===s.rows.length;
      pg.push({s,from:i,to:i+n,cont:i>0,sum:last&&sumH>0});
      h+=(pg.length>1?L.gapS:0)+L.secH+L.headH+n*L.ROW+(last?sumH:0); i+=n;
      if(!last){pages.push(pg);pg=null}
    }
  });
  if(pg) pages.push(pg);
  return pages;
}
function rcDrawPage(L,m,R,blocks,page,pages){
  const {PAD,W,headH,ROW}=L, title=meetName(m), sub=[...rcSub(m,R),pages>1?`Page ${page+1} of ${pages}`:""].filter(Boolean).join("  ·  ");
  const top=36, titleH=44, subH=sub?34:0, gap=24;
  let y=top+titleH+subH+gap;
  const H=y+blocks.reduce((t,b,i)=>t+(i?L.gapS:0)+L.secH+headH+(b.to-b.from)*ROW+(b.sum?L.sumH:0),0)+L.foot;
  const {cv,ctx}=psCanvas(W,H,PAD,title,sub,top,titleH,subH);
  blocks.forEach((b,i)=>{
    if(i) y+=L.gapS;
    // section name, runner count on the right
    ctx.fillStyle="#111111"; ctx.textAlign="left"; ctx.font=`700 30px ${PS_FONT}`;
    ctx.fillText(psFit(ctx,b.s.label+(b.cont?" (continued)":""),W-PAD*2-180),PAD,y+L.secH/2);
    ctx.fillStyle="#666666"; ctx.textAlign="right"; ctx.font=`400 21px ${PS_FONT}`; ctx.fillText(nRunners(b.s.n),W-PAD,y+L.secH/2);
    y=psDrawTable(ctx,PAD,y+L.secH,L.cols,headH,ROW,b.s.rows.slice(b.from,b.to).map(x=>rcCells(x,b.s,L.place))).bottom;
    // section stats under its table
    if(b.sum){ctx.fillStyle="#555555"; ctx.textAlign="left"; ctx.font=`400 22px ${PS_FONT}`; ctx.fillText(psFit(ctx,rcSum(b.s).join("  ·  "),W-PAD*2),PAD,y+34); y+=L.sumH}
  });
  return cv;
}
const rcFailHTML = () => `<div class="notice">Couldn't create the image. You can still copy the results as text.</div><button type="button" class="btn ghost block" data-act="rcCopy">${I.copy}Copy as text</button>`;
// Images are made when the recap sheet opens, so Share can open the share menu straight from the tap
async function rcMake(){
  const sh=SH; if(sh?.type!=="recap") return; const m=meetGet(sh.key), R=m&&recapOf(m), o=()=>$("#psOut");
  const gen=++psGen;
  if(!R||!R.secs.length){sh.err=true; if(o()) o().innerHTML=rcFailHTML(); return}
  const L=rcLayout(R), pages=rcPages(L,R,U.rcPer==="sec");
  const imgs=await psFiles(pages.length,p=>rcDrawPage(L,m,R,pages[p],p,pages.length),psSlug(`${meetName(m)} recap`,"meet-recap"));
  if(SH!==sh||gen!==psGen){imgs?.forEach(x=>URL.revokeObjectURL(x.url)); return}
  if(!imgs){sh.err=true; if(o()) o().innerHTML=rcFailHTML(); return}
  psClear(); sh.imgs=imgs; if(o()) o().innerHTML=psPreviewHTML(imgs,"Meet recap","rcCopy");
}
// For parents: "1. Maya Ortiz 20:05 (PR, −36 s)" per runner, each section's stats, then the team's PRs and season bests
function rcText(m){
  const R=recapOf(m), L=[meetName(m), rcSub(m,R).join(" · ")];
  const dist=dl=>/^[A-Z][a-z]/.test(dl)?dl.toLowerCase():dl.replace(/ miles$/," mile"); // "first 5K race", "first 2 mile race", "first mile time trial"
  R.secs.forEach(s=>{
    L.push("",s.label);
    s.rows.forEach(x=>{const n=x.b==="PR"?`PR, −${gapTxt(x.by)}`:x.b==="SB"?`season best${x.by?`, −${gapTxt(x.by)}`:""}`:x.b==="First"?`first ${dist(s.dl)} ${x.r.kind==="tt"?"time trial":"race"}`:"";
      L.push(`${x.tp}. ${x.a.name} ${fmtRace(x.sec)}${x.place?` · ${ord(x.place)} overall`:""}${n?` (${n})`:""}`)});
    const sum=rcSum(s); if(sum.length) L.push(sum.join(" · "));
  });
  const team=[R.prs?`${R.prs} PR${R.prs===1?"":"s"}`:"", R.sbs?`${R.sbs} season best${R.sbs===1?"":"s"}`:""].filter(Boolean);
  if(team.length) L.push("",`Team: ${team.join(", ")}`);
  return L.join("\n");
}

/* ============ text exports ============ */
function pacesText(a){

function workoutText(){

/* ============ backup ============ */
async function exportData(){
  const stamp=today(), name=`xc-ledger-backup-${stamp}.json`;
  // Must run straight from the tap (no await before share), or iPhone blocks the share sheet.
  const json=JSON.stringify({app:"xc-ledger",version:2,appVersion:APP_VERSION,exported:new Date().toISOString(),team:SET.team,athletes:S.athletes,results:S.results,trash:S.trash,aliases:S.aliases},null,1);
  const file=new File([json],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"XC Ledger backup"}); }
    else{ const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }
    SET.lastBackup=Date.now(); saveSet(); toast("Backup ready"); render(); setRefresh();
  }catch(err){ if(err&&err.name!=="AbortError") toast("Couldn't create the backup file."); }
}
// Reads backups from version 1 (athletes, results) and version 2 (adds trash, aliases).
function readImport(f){
  const box=$("#importBox"); const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch{d=null}
    const fail=m=>{box.innerHTML=`<div class="confirm" style="color:var(--bad)">${m}</div>`};
    if(!isObj(d)||d.app!=="xc-ledger"||!isObj(d.athletes)||!isObj(d.results)) return fail("That file isn't an XC Ledger backup. Choose a file named like xc-ledger-backup-2026-10-12.json.");
    const ver=d.version==null?1:+d.version;
    if(ver>2) return fail("This backup was made by a newer version of XC Ledger. Close and reopen the app to update it, then try again.");
    if(ver!==1&&ver!==2) return fail("That file isn't an XC Ledger backup. Choose a file named like xc-ledger-backup-2026-10-12.json.");
    SH.pending=d; const na=Object.keys(d.athletes).length, nr=Object.keys(d.results).length;
    box.innerHTML=`<div class="confirm">Replace everything on this phone with the backup from ${esc(new Date(d.exported).toLocaleDateString())} (${nRunners(na)}, ${nResults(nr)})? Your current data is saved as a snapshot first.<div class="actions" style="margin:0"><button type="button" class="btn ghost" data-act="closeSheet">Cancel</button><button type="button" class="btn" data-act="doImport">Restore</button></div></div>`;
    if(d.team&&!SET.team){SET.team=d.team;saveSet()}
  };
  r.readAsText(f);
}

// Updates: a new service worker taking over an already-running app shows a banner; the coach decides when to reload.
let swReg=null;
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let swHad=!!navigator.serviceWorker.controller;
  // The new worker deletes every other version's cache before it takes over, so if this page's own cache is still there, this page is the new version
  navigator.serviceWorker.addEventListener("controllerchange",()=>{const had=swHad; swHad=true; if(!had||U.swNew) return;
    const show=()=>{if(!U.swNew){U.swNew=true;render()}};
    try{caches.has(SW_CACHE).then(same=>{if(!same) show()},show)}catch{show()}});
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r}).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&swReg){try{swReg.update().catch(()=>{})}catch{}}});
}
